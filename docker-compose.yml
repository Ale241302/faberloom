name: faberloom

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: faberloom/mcp:latest
    container_name: faberloom-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FABERLOOM_STORE: sqlite
      FABERLOOM_DB: /data/spaces.sqlite
      FABERLOOM_BLOB_DIR: /data/blobs
      FABERLOOM_PORT: "8090"
    volumes:
      - faberloom_data:/data
      # Segunda copia offsite (fuera del volumen del contenedor): el respaldo se
      # copia aquí con FABERLOOM_BACKUP_OFFSITE_CMD.
      - /opt/backups/faberloom:/offsite
    networks:
      - harness-net
      - mwt_default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Puente de correo: sondea los buzones de las fuentes por usuario y entrega
  # eventos a las rutinas. Reutiliza la imagen y el mismo volumen/DB.
  bridge:
    image: faberloom/mcp:latest
    container_name: faberloom-bridge
    restart: unless-stopped
    command: ["node", "src/bridge/main.js"]
    env_file:
      - .env
    environment:
      FABERLOOM_STORE: sqlite
      FABERLOOM_DB: /data/spaces.sqlite
      FABERLOOM_BLOB_DIR: /data/blobs
      FABERLOOM_BRIDGE_INTERVAL_MS: "60000"
    volumes:
      - faberloom_data:/data
    networks:
      - harness-net
      - mwt_default
    depends_on:
      - mcp
    # El puente no expone HTTP; desactiva el healthcheck heredado de la imagen.
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  harness-net:
    name: harness-net
    external: true
  # MinIO (almacén de blobs) vive en esta red del stack mwt.
  mwt_default:
    name: mwt_default
    external: true

volumes:
  faberloom_data:
    name: faberloom-data
